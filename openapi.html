<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open API Documentation</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <header>
        <h1>Open API Documentation</h1>
        <p>This page describes the available endpoints for my sample API.</p>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <section id="open-api">
        <div class="endpoint">
            <h3>GET /projects</h3>
            <p>Returns a list of all projects.</p>
        </div>

        <div class="endpoint">
            <h3>POST /messages</h3>
            <p>Creates a new message from the contact form.</p>
        </div>

        <div class="endpoint">
            <h3>DELETE /projects/:id</h3>
            <p>Deletes a project by ID.</p>
        </div>
    </section>

</body>
</html>
